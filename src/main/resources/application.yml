spring:
  application:
    name: expense-tracker-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    "[io.github.fatima797.expensetracker]": INFO
    "[org.springframework.security]": WARN
    "[org.hibernate.SQL]": WARN

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
